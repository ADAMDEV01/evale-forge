version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '8000:8000'
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/backend/data/evalforge.db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the environment}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-60}
      GROQ_INPUT_COST_PER_MILLION: ${GROQ_INPUT_COST_PER_MILLION:-}
      GROQ_OUTPUT_COST_PER_MILLION: ${GROQ_OUTPUT_COST_PER_MILLION:-}
    volumes:
      - backend_data:/app/backend/data
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health").read()']
      interval: 10s
      timeout: 5s
      retries: 5

  evaluation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ['python', '-m', 'backend.app.jobs.evaluation_worker']
    restart: unless-stopped
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/backend/data/evalforge.db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the environment}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-60}
      GROQ_INPUT_COST_PER_MILLION: ${GROQ_INPUT_COST_PER_MILLION:-}
      GROQ_OUTPUT_COST_PER_MILLION: ${GROQ_OUTPUT_COST_PER_MILLION:-}
      EVALUATION_WORKER_POLL_SECONDS: ${EVALUATION_WORKER_POLL_SECONDS:-2}
    volumes:
      - backend_data:/app/backend/data
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - '4173:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
