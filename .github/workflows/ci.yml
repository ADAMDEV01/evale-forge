name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt
      - run: pytest backend/tests -q

  evaluation-regression-gate:
    name: Evaluation regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests/test_evaluation_regression_gate.py -q

  render-blueprint:
    name: Render worker blueprint validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate Render worker blueprint
        run: ruby -ryaml -e 'services = YAML.load_file("render.yaml").fetch("services"); abort "Expected one worker service" unless services.length == 1 && services[0]["type"] == "worker"; abort "Automatic deployments must remain disabled" unless services[0]["autoDeployTrigger"] == "off"; abort "Unexpected worker command" unless services[0]["dockerCommand"] == "python -m backend.app.jobs.evaluation_worker"'
